<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tandoor Tavern — Opening Soon</title>
    <meta
      name="description"
      content="Your new local is heating up. Tandoor Tavern is opening soon at 192 Elm Park Avenue, Hornchurch RM12 4SD."
    />
    <link rel="canonical" href="https://tandoortavern.co.uk/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="preload"
      as="image"
      href="assets/paisley-corner-left.png"
      type="image/png"
    />
    <link
      rel="preload"
      as="image"
      href="assets/tandoor-tavern-logo-transparent.png"
      type="image/png"
    />
    <link
      rel="preload"
      as="image"
      href="assets/tandoor-tavern-background.png"
      type="image/png"
    />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <img
          class="header-ornament header-ornament--left"
          src="assets/paisley-corner-left.png"
          alt=""
          width="1200"
          height="1200"
          decoding="async"
          aria-hidden="true"
        />
        <img
          class="header-ornament header-ornament--right"
          src="assets/paisley-corner-right.png"
          alt=""
          width="1200"
          height="1200"
          decoding="async"
          aria-hidden="true"
        />
        <div class="site-header__inner">
          <img
            class="site-logo"
            src="assets/tandoor-tavern-logo-transparent.png"
            alt="Tandoor Tavern — Indo Fusion, Bar, Sports"
            width="1254"
            height="1254"
            decoding="async"
            fetchpriority="high"
          />
        </div>

        <!-- Gold cradle sits on the hard cut between header and hero -->
        <svg
          class="header-divider"
          viewBox="0 0 1200 48"
          preserveAspectRatio="none"
          aria-hidden="true"
          focusable="false"
        >
          <defs>
            <linearGradient id="dividerGold" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#a56822" stop-opacity="0.15" />
              <stop offset="12%" stop-color="#d29a43" stop-opacity="0.95" />
              <stop offset="50%" stop-color="#f4d08a" stop-opacity="1" />
              <stop offset="88%" stop-color="#d29a43" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#a56822" stop-opacity="0.15" />
            </linearGradient>
          </defs>
          <!-- Charcoal fill above the cut so the cradle is opaque -->
          <path
            fill="#080808"
            d="M0 0 H1200 V10
               H770
               C720 10, 695 10, 675 18
               L645 38
               C635 44, 615 46, 600 46
               C585 46, 565 44, 555 38
               L525 18
               C505 10, 480 10, 430 10
               H0 Z"
          />
          <path
            fill="none"
            stroke="url(#dividerGold)"
            stroke-width="1.55"
            stroke-linejoin="round"
            vector-effect="non-scaling-stroke"
            d="M0 10
               H430
               C480 10, 505 10, 525 18
               L555 38
               C565 44, 585 46, 600 46
               C615 46, 635 44, 645 38
               L675 18
               C695 10, 720 10, 770 10
               H1200"
          />
        </svg>
      </header>

      <main class="hero">
        <img
          class="hero__image"
          src="assets/tandoor-tavern-background.png"
          alt=""
          width="1672"
          height="941"
          decoding="async"
          fetchpriority="high"
          aria-hidden="true"
        />
        <div class="hero__overlay" aria-hidden="true"></div>

        <div class="hero__content">
          <a
            class="instagram-follow"
            href="https://www.instagram.com/tandoor.tavern/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              class="instagram-follow__icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              aria-hidden="true"
              focusable="false"
            >
              <rect
                x="3.5"
                y="3.5"
                width="17"
                height="17"
                rx="4.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
              />
              <circle
                cx="12"
                cy="12"
                r="4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
              />
              <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" />
            </svg>
            <span class="instagram-follow__label">Follow on Instagram</span>
          </a>

          <p class="hero__eyebrow">Your new local is heating up.</p>
          <h1 class="hero__title">Opening Soon</h1>

          <div class="ornament" aria-hidden="true">
            <span class="ornament__line"></span>
            <svg
              class="ornament__flourish"
              viewBox="0 0 140 36"
              width="100"
              height="26"
              focusable="false"
            >
              <defs>
                <linearGradient id="flourishGold" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#f4d08a" />
                  <stop offset="45%" stop-color="#d29a43" />
                  <stop offset="100%" stop-color="#a56822" />
                </linearGradient>
              </defs>
              <g
                fill="none"
                stroke="url(#flourishGold)"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M8 18
                     C20 18, 24 8, 36 10
                     C46 12, 48 18, 58 18
                     C52 18, 48 26, 38 26
                     C28 26, 24 18, 18 16"
                />
                <path
                  d="M132 18
                     C120 18, 116 8, 104 10
                     C94 12, 92 18, 82 18
                     C88 18, 92 26, 102 26
                     C112 26, 116 18, 122 16"
                />
                <path d="M70 10 L78 18 L70 26 L62 18 Z" />
                <path d="M70 14 L74 18 L70 22 L66 18 Z" />
              </g>
            </svg>
            <span class="ornament__line"></span>
          </div>

          <address class="location">
            <svg
              class="location__pin"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              aria-hidden="true"
              focusable="false"
            >
              <defs>
                <linearGradient id="pinGold" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#f4d08a" />
                  <stop offset="55%" stop-color="#d29a43" />
                  <stop offset="100%" stop-color="#a56822" />
                </linearGradient>
              </defs>
              <path
                fill="url(#pinGold)"
                d="M12 2.4c-3.55 0-6.4 2.78-6.4 6.2 0 4.55 5.35 10.45 5.95 11.1a.65.65 0 0 0 .9 0c.6-.65 5.95-6.55 5.95-11.1 0-3.42-2.85-6.2-6.4-6.2Zm0 8.85a2.55 2.55 0 1 1 0-5.1 2.55 2.55 0 0 1 0 5.1Z"
              />
              <circle cx="12" cy="8.6" r="1.55" fill="#1a1208" />
            </svg>
            <p class="location__line">192 ELM PARK AVENUE</p>
            <p class="location__line">HORNCHURCH · RM12 4SD</p>
          </address>
        </div>
      </main>
    </div>

    <script src="js/main.js" defer></script>
  </body>
</html>
